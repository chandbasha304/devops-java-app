<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Data & Ciphertext Decoder</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap');

        :root {
            --bg: #0b0f19;
            --surface: #111827;
            --card: #1f2937;
            --border: #374151;
            --primary: #3b82f6;
            --accent: #0ea5e9;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text: #f9fafb;
            --muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 30px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #60a5fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.95rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        textarea {
            width: 100%;
            background: #030712;
            border: 1px solid var(--border);
            color: #38bdf8;
            font-family: 'Fira Code', monospace;
            padding: 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            outline: none;
            resize: vertical;
            min-height: 120px;
            margin-bottom: 14px;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59,130,246,0.3);
        }

        .btn {
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .results-grid {
            display: grid;
            gap: 16px;
        }

        .result-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .result-title {
            font-weight: 700;
            font-size: 1rem;
            color: #93c5fd;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-tag {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid #10b981;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        pre {
            background: #030712;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: #f1f5f9;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Universal Data &amp; Ciphertext Decoder</h1>
        <p class="subtitle">Paste any mysterious encoded string, PDF stream, token, Base64, Hex, or ciphertext to identify &amp; decode it.</p>
    </div>

    <div class="card">
        <label>Paste Your Mysterious Encrypted / Encoded Data Here:</label>
        <textarea id="cipherInput" placeholder="Paste your raw string, Base64, Hex, JWT, or URL encoded payload here..."></textarea>
        <button class="btn" onclick="decodeEverything()">🔍 Auto-Detect &amp; Decode</button>
    </div>

    <div class="results-grid" id="resultsContainer"></div>
</div>

<script>
    function decodeEverything() {
        const raw = document.getElementById('cipherInput').value.trim();
        const container = document.getElementById('resultsContainer');
        container.innerHTML = '';

        if (!raw) {
            container.innerHTML = '<div class="card" style="color: #f87171;">⚠️ Please paste some data in the box above!</div>';
            return;
        }

        let detected = [];

        // 0. PDF Stream Detection (%PDF-1.x)
        if (raw.startsWith('%PDF-') || raw.includes('%PDF-1.')) {
            try {
                const len = raw.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = raw.charCodeAt(i) & 0xff;
                }
                const pdfBlob = new Blob([bytes], { type: 'application/pdf' });
                const pdfUrl = URL.createObjectURL(pdfBlob);
                detected.push({
                    title: '📄 Raw PDF Document Stream (%PDF-1.4)',
                    content: `VALID PDF DOCUMENT DETECTED!\nSize: ${len} bytes\n\n👇 Click the button below to view or download the visual PDF document:`,
                    isPdf: true,
                    pdfUrl: pdfUrl
                });
            } catch (e) {
                console.error("PDF stream decode error", e);
            }
        }

        // 1. URL Decode
        try {
            const urlDecoded = decodeURIComponent(raw);
            if (urlDecoded !== raw) {
                detected.push({ title: 'URL / Percent Encoding', content: urlDecoded });
            }
        } catch(e) {}

        // 2. JWT (JSON Web Token)
        if (/^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(raw)) {
            try {
                const parts = raw.split('.');
                const b64 = (s) => JSON.parse(atob(s.replace(/-/g, '+').replace(/_/g, '/')));
                const header = b64(parts[0]);
                const payload = b64(parts[1]);
                detected.push({
                    title: 'JSON Web Token (JWT)',
                    content: `HEADER:\n${JSON.stringify(header, null, 2)}\n\nPAYLOAD:\n${JSON.stringify(payload, null, 2)}`
                });
            } catch(e) {}
        }

        // 3. Hexadecimal Decode
        const cleanHex = raw.replace(/\s+/g, '').replace(/0x/g, '').replace(/:/g, '');
        if (/^[0-9a-fA-F]+$/.test(cleanHex) && cleanHex.length % 2 === 0) {
            try {
                let ascii = '';
                for (let i = 0; i < cleanHex.length; i += 2) {
                    ascii += String.fromCharCode(parseInt(cleanHex.substr(i, 2), 16));
                }
                detected.push({ title: `Hexadecimal (${cleanHex.length / 2} bytes)`, content: ascii });
            } catch(e) {}
        }

        // 4. Base64 Decode
        const cleanB64 = raw.replace(/\s+/g, '');
        if (/^[A-Za-z0-9+/=_-]+$/.test(cleanB64) && cleanB64.length >= 4) {
            try {
                let norm = cleanB64.replace(/-/g, '+').replace(/_/g, '/');
                while (norm.length % 4) norm += '=';
                const decoded = atob(norm);
                detected.push({ title: 'Base64 Decoded Text', content: decoded });

                // Try JSON inside Base64
                try {
                    const parsedJson = JSON.parse(decoded);
                    detected.push({ title: 'JSON Object (Inside Base64)', content: JSON.stringify(parsedJson, null, 2) });
                } catch(e) {}
            } catch(e) {}
        }

        // 5. Check Hash Formats
        if (/^[0-9a-fA-F]{32}$/.test(raw)) {
            detected.push({ title: 'MD5 Hash (One-Way Checksum)', content: 'This is a 128-bit MD5 hash. Hashes are one-way and cannot be decrypted without a dictionary/rainbow table.' });
        } else if (/^[0-9a-fA-F]{64}$/.test(raw)) {
            detected.push({ title: 'SHA-256 Hash (One-Way Checksum)', content: 'This is a 256-bit SHA-256 hash. One-way mathematical digest.' });
        }

        if (detected.length === 0) {
            container.innerHTML = `
                <div class="card" style="border-color: #f59e0b;">
                    <h3 style="color: #fbbf24; margin-bottom: 8px;">🔒 High-Entropy True Ciphertext (AES / RSA / Chacha20)</h3>
                    <p style="color: #cbd5e1; font-size: 0.9rem;">
                        The pasted data is not a simple encoding (not plain Base64, Hex, or JWT). It appears to be <strong>cryptographic ciphertext</strong> encrypted with a secret key.
                    </p>
                    <div style="margin-top: 14px; background: #030712; padding: 12px; border-radius: 6px; font-size: 0.85rem; color: #93c5fd;">
                        To decrypt this, you need:<br>
                        1. The <strong>Algorithm</strong> (e.g., AES-256-CBC, AES-GCM, RSA, Fernet)<br>
                        2. The <strong>Secret Key / Password</strong><br>
                        3. The <strong>IV / Nonce</strong> (if symmetric cipher)
                    </div>
                </div>
            `;
            return;
        }

        detected.forEach((item, idx) => {
            const box = document.createElement('div');
            box.className = 'result-box';
            
            let pdfActionHtml = '';
            if (item.isPdf && item.pdfUrl) {
                pdfActionHtml = `
                    <div style="margin-top: 12px; display: flex; gap: 10px;">
                        <a href="${item.pdfUrl}" target="_blank" class="btn" style="text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
                            👁️ Open & View PDF in New Tab
                        </a>
                        <a href="${item.pdfUrl}" download="decoded_document.pdf" class="btn" style="background: linear-gradient(135deg, #059669, #10b981); text-decoration: none;">
                            💾 Save as .PDF File
                        </a>
                    </div>
                    <iframe src="${item.pdfUrl}#view=FitH" style="width: 100%; height: 500px; border-radius: 8px; border: 1px solid #374151; margin-top: 14px; background: white;"></iframe>
                `;
            }

            box.innerHTML = `
                <div class="result-header">
                    <span class="result-title">🔍 Format ${idx + 1}: ${item.title}</span>
                    <span class="badge-tag">Decoded</span>
                </div>
                <pre>${item.content.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre>
                ${pdfActionHtml}
            `;
            container.appendChild(box);
        });
    }
</script>

</body>
</html>
